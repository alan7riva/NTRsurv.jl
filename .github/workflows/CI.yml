name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# julia-actions/cache uses this permission to manage old caches.
permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.12'
          - '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia dependencies
        uses: julia-actions/cache@v3

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
